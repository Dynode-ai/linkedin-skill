<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Profile Audit</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #14171c; --muted: #5d6673; --line: #e3e6eb;
    --accent: #2563eb; --accent-soft: #e8efff; --good: #15803d; --good-soft: #e7f6ec;
    --ok: #b45309; --ok-soft: #fdf3e2; --weak: #b91c1c; --weak-soft: #fde9e9; --na: #8a93a0;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171b21; --ink: #e8ebef; --muted: #9aa4b2; --line: #2a3039;
      --accent: #6b9bff; --accent-soft: #1b2740; --good: #4ade80; --good-soft: #14281c;
      --ok: #fbbf24; --ok-soft: #2d2412; --weak: #f87171; --weak-soft: #2e1717; --na: #6b7480;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  header.top h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  header.top .meta { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 22px; margin-bottom: 18px; }
  h2 { font-size: 16px; margin: 0 0 14px; letter-spacing: -.005em; }
  h2 .sub { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .hero { display: grid; grid-template-columns: 180px 1fr; gap: 26px; align-items: center; }
  @media (max-width: 640px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } .hero p.summary { text-align: left; } .hero .chips { justify-content: center; } }
  .ring { position: relative; width: 170px; height: 170px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .num b { font-size: 44px; line-height: 1; letter-spacing: -.03em; }
  .ring .num span { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .band { display: inline-block; font-weight: 600; font-size: 13px; padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
  .hero p.summary { margin: 0 0 12px; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .chip b { color: var(--ink); font-weight: 600; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .moves { display: grid; gap: 10px; counter-reset: move; }
  .move { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
  .move::before { counter-increment: move; content: counter(move); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .move .t { font-weight: 600; }
  .move .w { color: var(--muted); font-size: 13.5px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 640px) { .move { grid-template-columns: 34px 1fr; } .move .tags { grid-column: 2; justify-content: flex-start; } }
  .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
  .cats { display: grid; gap: 12px; }
  .cat { display: grid; grid-template-columns: 170px 1fr 64px; gap: 12px; align-items: center; }
  @media (max-width: 640px) { .cat { grid-template-columns: 1fr 56px; } .cat .bar { grid-column: 1 / -1; order: 3; } }
  .cat .name { font-weight: 600; font-size: 14px; }
  .cat .verdict { color: var(--muted); font-size: 12.5px; font-weight: 400; display: block; }
  .bar { height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; }
  .cat .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .ba { grid-template-columns: 1fr; } }
  .pcard { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
  .pcard .banner { height: 64px; background: linear-gradient(120deg, #9aa4b2, #cfd5dd); }
  .pcard.after .banner { background: linear-gradient(120deg, var(--accent), #8b5cf6); }
  .pcard .body { padding: 0 16px 16px; }
  .pcard .avatar { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--card); background: #c7cdd6; margin-top: -32px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 22px; }
  .pcard.after .avatar { background: var(--accent); }
  .pcard .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); float: right; margin-top: 8px; }
  .pcard .nm { font-weight: 700; font-size: 17px; margin-top: 6px; }
  .pcard .hl { font-size: 14px; margin-top: 2px; }
  .pcard .loc { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .rw { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .rw .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .rw .head .l { font-weight: 600; font-size: 13.5px; }
  .rw .head .r { display: flex; gap: 8px; align-items: center; }
  .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .count.over { color: var(--weak); font-weight: 700; }
  .rw pre { margin: 0; padding: 12px 14px; white-space: pre-wrap; word-wrap: break-word; font: inherit; }
  .rw .why { padding: 0 14px 12px; color: var(--muted); font-size: 13px; }
  button.copy { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
  button.copy:hover { border-color: var(--accent); color: var(--accent); }
  button.copy.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .sec-title { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  .sec-title:first-child { margin-top: 0; }
  table.kw { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.kw th, table.kw td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; }
  table.kw th:first-child, table.kw td:first-child { text-align: left; }
  table.kw th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .yes { color: var(--good); font-weight: 700; } .no { color: var(--weak); opacity: .75; }
  .kwwrap { overflow-x: auto; }
  details.f { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  details.f summary { cursor: pointer; padding: 11px 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; list-style: none; }
  details.f summary::-webkit-details-marker { display: none; }
  details.f summary::after { content: "+"; color: var(--muted); }
  details.f[open] summary::after { content: "–"; }
  details.f .in { padding: 0 14px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { details.f .in { grid-template-columns: 1fr; } }
  details.f h4 { margin: 4px 0 6px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
  details.f ul { margin: 0; padding-left: 18px; }
  details.f li { margin-bottom: 4px; font-size: 14px; }
  .h-good { color: var(--good); } .h-fix { color: var(--weak); }
  .checks label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .checks input { margin-top: 4px; accent-color: var(--accent); }
  .checks label.done span { text-decoration: line-through; color: var(--muted); }
  .progress { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 26px; }
  footer a { color: var(--accent); text-decoration: none; }
  .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
  @media print { body { background: #fff; } .card { box-shadow: none; break-inside: avoid; } button.copy { display: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading report… If this stays empty, <code>data.js</code> is missing next to this file.</div></div>
<script src="data.js"></script>
<script>
(function () {
  var R = window.REPORT;
  var app = document.getElementById('app');
  if (!R) return;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function chars(s) { return Array.from(String(s || '')).length; }
  function color(status) { return {good: 'var(--good)', ok: 'var(--ok)', weak: 'var(--weak)', na: 'var(--na)'}[status] || 'var(--accent)'; }
  function statusOf(score, max) { if (max == null || score == null) return 'na'; var p = score / max; return p >= .8 ? 'good' : p >= .55 ? 'ok' : 'weak'; }
  function bandStyle(total) { var s = total >= 85 ? 'good' : total >= 70 ? 'good' : total >= 50 ? 'ok' : 'weak'; return 'background:var(--' + s + '-soft);color:var(--' + s + ')'; }
  function initials(n) { return String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join(''); }

  var h = [];
  var p = R.person || {};
  var sc = R.score || {};
  document.title = 'LinkedIn Audit · ' + (p.name || 'Profile');

  h.push('<header class="top"><h1>LinkedIn Profile Audit' + (p.name ? ' · ' + esc(p.name) : '') + '</h1><div class="meta">' + esc(R.generated || '') + '</div></header>');

  // Hero
  var total = Math.max(0, Math.min(100, Number(sc.total) || 0));
  var C = 2 * Math.PI * 74, off = C * (1 - total / 100);
  var ringColor = total >= 70 ? 'var(--good)' : total >= 50 ? 'var(--ok)' : 'var(--weak)';
  h.push('<section class="card hero"><div class="ring"><svg width="170" height="170" viewBox="0 0 170 170"><circle cx="85" cy="85" r="74" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="85" cy="85" r="74" fill="none" stroke="' + ringColor + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg><div class="num"><b>' + total + '</b><span>out of 100</span></div></div><div>');
  if (sc.band) h.push('<span class="band" style="' + bandStyle(total) + '">' + esc(sc.band) + '</span>');
  if (R.summary) h.push('<p class="summary">' + esc(R.summary) + '</p>');
  h.push('<div class="chips">');
  if (R.goal) h.push('<span class="chip">Goal: <b>' + esc(R.goal) + '</b></span>');
  if (R.audience) h.push('<span class="chip">Audience: <b>' + esc(R.audience) + '</b></span>');
  if (sc.potential) h.push('<span class="chip">After fixes: <b>~' + esc(sc.potential) + '</b></span>');
  h.push('</div>');
  if (sc.coverage) h.push('<div class="note">' + esc(sc.coverage) + '</div>');
  h.push('</div></section>');

  // Top moves
  if (R.priorities && R.priorities.length) {
    h.push('<section class="card"><h2>Do these first<span class="sub">highest impact for the least effort</span></h2><div class="moves">');
    R.priorities.forEach(function (m) {
      h.push('<div class="move"><div><div class="t">' + esc(m.title) + '</div><div class="w">' + esc(m.why || '') + '</div></div><div class="tags">' +
        (m.impact ? '<span class="tag">Impact: ' + esc(m.impact) + '</span>' : '') + (m.effort ? '<span class="tag">' + esc(m.effort) + '</span>' : '') + '</div></div>');
    });
    h.push('</div></section>');
  }

  // Categories
  if (R.categories && R.categories.length) {
    h.push('<section class="card"><h2>Score breakdown</h2><div class="cats">');
    R.categories.forEach(function (c) {
      var st = c.status || statusOf(c.score, c.max);
      var pct = st === 'na' ? 0 : Math.round(100 * (c.score || 0) / (c.max || 1));
      h.push('<div class="cat"><div class="name">' + esc(c.name) + '<span class="verdict">' + esc(c.verdict || '') + '</span></div><div class="bar"><i style="width:' + pct + '%;background:' + color(st) + '"></i></div><div class="val">' +
        (st === 'na' ? '<span style="color:var(--na)">n/a</span>' : esc(c.score) + '<span style="color:var(--muted);font-weight:400">/' + esc(c.max) + '</span>') + '</div></div>');
    });
    h.push('</div></section>');
  }

  // Before / after preview
  if (R.preview) {
    var pv = R.preview;
    h.push('<section class="card"><h2>Before → after<span class="sub">what people see in search, comments and invites</span></h2><div class="ba">');
    [['before', pv.before_headline], ['after', pv.after_headline]].forEach(function (x) {
      h.push('<div class="pcard ' + x[0] + '"><div class="banner"></div><div class="body"><span class="label">' + x[0] + '</span><div class="avatar">' + esc(initials(p.name)) + '</div><div class="nm">' + esc(p.name || 'Your name') + '</div><div class="hl">' + esc(x[1] || '') + '</div>' + (p.location ? '<div class="loc">' + esc(p.location) + '</div>' : '') + '</div></div>');
    });
    h.push('</div></section>');
  }

  // Rewrites
  var copyStore = [];
  if (R.rewrites && R.rewrites.length) {
    h.push('<section class="card"><h2>Ready-to-paste rewrites<span class="sub">counts are live character counts</span></h2>');
    R.rewrites.forEach(function (sec) {
      h.push('<div class="sec-title">' + esc(sec.section) + '</div>');
      (sec.options || []).forEach(function (o) {
        var n = chars(o.text), lim = o.limit || sec.limit;
        var idx = copyStore.push(o.text) - 1;
        h.push('<div class="rw"><div class="head"><span class="l">' + esc(o.label || sec.section) + '</span><span class="r"><span class="count' + (lim && n > lim ? ' over' : '') + '">' + n + (lim ? ' / ' + lim : '') + ' chars</span><button class="copy" data-i="' + idx + '">Copy</button></span></div><pre>' + esc(o.text) + '</pre>' + (o.note ? '<div class="why">' + esc(o.note) + '</div>' : '') + '</div>');
      });
    });
    h.push('</section>');
  }

  // Keyword matrix
  if (R.keywords && R.keywords.terms && R.keywords.terms.length) {
    var K = R.keywords, fields = K.fields || ['Headline', 'About', 'Experience', 'Skills'];
    h.push('<section class="card"><h2>Keyword coverage<span class="sub">' + esc(K.caption || 'terms your target audience searches for') + '</span></h2><div class="kwwrap"><table class="kw"><thead><tr><th>Keyword</th>');
    fields.forEach(function (f) { h.push('<th>' + esc(f) + '</th>'); });
    h.push('</tr></thead><tbody>');
    K.terms.forEach(function (t, i) {
      var row = (K.matrix && K.matrix[i]) || [];
      h.push('<tr><td>' + esc(t) + '</td>');
      fields.forEach(function (_, j) { h.push(row[j] ? '<td class="yes">✓</td>' : '<td class="no">✗</td>'); });
      h.push('</tr>');
    });
    h.push('</tbody></table></div>');
    if (K.note) h.push('<div class="note">' + esc(K.note) + '</div>');
    h.push('</section>');
  }

  // Findings
  if (R.findings && R.findings.length) {
    h.push('<section class="card"><h2>Section-by-section</h2>');
    R.findings.forEach(function (f, i) {
      h.push('<details class="f"' + (i === 0 ? ' open' : '') + '><summary><span>' + esc(f.section) + '</span></summary><div class="in"><div><h4 class="h-good">Working</h4><ul>' +
        (f.working || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div><div><h4 class="h-fix">Fix</h4><ul>' +
        (f.fix || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></div></details>');
    });
    h.push('</section>');
  }

  // Checklist
  if (R.checklist && R.checklist.length) {
    h.push('<section class="card"><h2>Implementation checklist</h2><div class="progress" id="prog"></div><div class="checks">');
    R.checklist.forEach(function (c, i) {
      var txt = typeof c === 'string' ? c : c.item;
      h.push('<label><input type="checkbox" data-k="' + i + '"><span>' + esc(txt) + '</span></label>');
    });
    h.push('</div></section>');
  }

  h.push('<footer>Made with the open-source <a href="' + esc(R.repo_url || 'https://github.com/Dynode-ai/linkedin-skill') + '">' + esc(R.tool_name || 'LinkedIn skill for Claude Code') + '</a>. Your data never left your computer.</footer>');
  app.innerHTML = h.join('');

  // Copy buttons
  app.querySelectorAll('button.copy').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = copyStore[+b.getAttribute('data-i')];
      var done = function () { b.textContent = 'Copied'; b.classList.add('done'); setTimeout(function () { b.textContent = 'Copy'; b.classList.remove('done'); }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
      function fallback() { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); }
    });
  });

  // Checklist persistence (per-browser convenience only)
  var key = 'li-audit-' + (p.name || '') + '-' + (R.generated || '');
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
  var boxes = app.querySelectorAll('.checks input');
  function refresh() {
    var n = 0; boxes.forEach(function (bx) { bx.parentNode.classList.toggle('done', bx.checked); if (bx.checked) n++; });
    var pr = document.getElementById('prog'); if (pr) pr.textContent = n + ' of ' + boxes.length + ' done';
  }
  boxes.forEach(function (bx) {
    bx.checked = !!saved[bx.getAttribute('data-k')];
    bx.addEventListener('change', function () { saved[bx.getAttribute('data-k')] = bx.checked; try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) {} refresh(); });
  });
  refresh();
})();
</script>
</body>
</html>
