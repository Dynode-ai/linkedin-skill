<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carousel</title>
<style>
  @page { size: 1080px 1350px; margin: 0; }
  :root { --bg: #0f172a; --fg: #f8fafc; --accent: #38bdf8; --muted: #94a3b8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #e9e9e6; color: #1b1b1b; font-family: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
         padding: 12px 16px; background: inherit; border-bottom: 1px solid rgba(127,127,127,.25); }
  .bar h1 { font-size: 16px; margin: 0; }
  .bar p { margin: 2px 0 0; font-size: 12.5px; opacity: .75; }
  .bar button { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 999px; border: 0; background: #0a66c2; color: #fff; cursor: pointer; }
  .deck { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 22px 16px 60px; }
  .holder { width: calc(1080px * var(--s)); height: calc(1350px * var(--s)); position: relative; flex: none; }
  .slide { width: 1080px; height: 1350px; transform: scale(var(--s)); transform-origin: top left; position: absolute; top: 0; left: 0;
           background: var(--bg); color: var(--fg); padding: 110px 100px 150px; display: flex; flex-direction: column; overflow: hidden;
           box-shadow: 0 6px 24px rgba(0,0,0,.18); border-radius: 6px; }
  .slide .body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .kicker { font-size: 34px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 36px; }
  .title { font-size: 96px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .slide.point .title, .slide.list .title, .slide.cta .title { font-size: 72px; }
  .subtitle { font-size: 40px; line-height: 1.3; color: var(--muted); margin-top: 40px; }
  .num { font-size: 140px; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 30px; letter-spacing: -.03em; }
  .text { font-size: 44px; line-height: 1.38; margin-top: 44px; color: var(--fg); opacity: .92; white-space: pre-line; }
  ul.items { list-style: none; margin: 46px 0 0; padding: 0; }
  ul.items li { font-size: 44px; line-height: 1.3; padding: 18px 0 18px 64px; position: relative; border-top: 2px solid rgba(255,255,255,.12); }
  ul.items li::before { content: ""; position: absolute; left: 6px; top: 40px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); }
  .stat { font-size: 220px; font-weight: 800; line-height: 1; color: var(--accent); letter-spacing: -.04em; }
  .statlabel { font-size: 52px; line-height: 1.25; margin-top: 30px; }
  blockquote { margin: 0; font-size: 64px; line-height: 1.25; font-weight: 700; }
  blockquote::before { content: "\201C"; display: block; font-size: 180px; line-height: .8; color: var(--accent); }
  .attr { font-size: 36px; color: var(--muted); margin-top: 40px; }
  .foot { position: absolute; left: 100px; right: 100px; bottom: 60px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: var(--muted); }
  .foot .who { display: flex; align-items: center; gap: 18px; }
  .foot .av { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--bg); font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .foot b { color: var(--fg); font-weight: 700; display: block; }
  .swipe { color: var(--accent); font-weight: 700; }
  .empty { padding: 80px 20px; text-align: center; }
  @media print {
    body { background: none; }
    .bar { display: none; }
    .deck { display: block; padding: 0; }
    .holder { width: 1080px; height: 1350px; break-after: page; page-break-after: always; }
    .slide { transform: none; box-shadow: none; border-radius: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="app"><div class="empty">Loading… If this stays empty, <code>data.js</code> is missing next to this file.</div></div>
<script src="data.js"></script>
<script>
(function () {
  var C = window.CAROUSEL, app = document.getElementById('app');
  if (!C) return;
  var th = C.theme || {};
  ['bg', 'fg', 'accent', 'muted'].forEach(function (k) { if (th[k]) document.documentElement.style.setProperty('--' + k, th[k]); });
  function el(tag, cls, parent, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; }
  function initials(n) { return String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0].toUpperCase(); }).join(''); }

  app.textContent = '';
  document.title = C.title || 'Carousel';
  var bar = el('div', 'bar', app), info = el('div', null, bar);
  el('h1', null, info, (C.title || 'Carousel') + ' · ' + (C.slides || []).length + ' slides');
  el('p', null, info, 'Click "Save as PDF", choose "Save as PDF" as the printer, then upload the file to LinkedIn as a document post.');
  var btn = el('button', null, bar, 'Save as PDF');
  btn.addEventListener('click', function () { window.print(); });
  var deck = el('div', 'deck', app);
  var a = C.author || {}, total = (C.slides || []).length;

  (C.slides || []).forEach(function (s, i) {
    var holder = el('div', 'holder', deck);
    var sl = el('div', 'slide ' + (s.type || 'point'), holder);
    var body = el('div', 'body', sl);
    switch (s.type) {
      case 'cover':
        if (s.kicker) el('div', 'kicker', body, s.kicker);
        el('h2', 'title', body, s.title || '');
        if (s.subtitle) el('div', 'subtitle', body, s.subtitle);
        break;
      case 'list':
        if (s.kicker) el('div', 'kicker', body, s.kicker);
        el('h2', 'title', body, s.title || '');
        var ul = el('ul', 'items', body);
        (s.items || []).forEach(function (it) { el('li', null, ul, it); });
        break;
      case 'stat':
        if (s.kicker) el('div', 'kicker', body, s.kicker);
        el('div', 'stat', body, s.value || '');
        el('div', 'statlabel', body, s.label || '');
        if (s.body) el('div', 'text', body, s.body);
        break;
      case 'quote':
        el('blockquote', null, body, s.quote || '');
        if (s.attribution) el('div', 'attr', body, '— ' + s.attribution);
        break;
      case 'cta':
        if (s.kicker) el('div', 'kicker', body, s.kicker);
        el('h2', 'title', body, s.title || '');
        if (s.body) el('div', 'text', body, s.body);
        break;
      default:
        if (s.number) el('div', 'num', body, s.number);
        else if (s.kicker) el('div', 'kicker', body, s.kicker);
        el('h2', 'title', body, s.title || '');
        if (s.body) el('div', 'text', body, s.body);
    }
    var foot = el('div', 'foot', sl), who = el('div', 'who', foot);
    el('div', 'av', who, initials(a.name));
    var nm = el('div', null, who); el('b', null, nm, a.name || ''); if (a.headline) el('span', null, nm, a.headline);
    el('div', i === 0 && total > 1 ? 'swipe' : null, foot, i === 0 && total > 1 ? 'Swipe →' : (i + 1) + ' / ' + total);
    fit(body);
  });

  // Shrink text on a slide until it fits, so long copy never gets clipped.
  function fit(body) {
    var guard = 0;
    while (body.scrollHeight > body.clientHeight + 2 && guard++ < 40) {
      Array.prototype.forEach.call(body.querySelectorAll('.title,.text,li,blockquote,.subtitle,.statlabel,.stat'), function (n) {
        var fs = parseFloat(getComputedStyle(n).fontSize); n.style.fontSize = (fs * 0.94) + 'px';
      });
    }
  }
  function scale() {
    var w = Math.min(document.documentElement.clientWidth - 32, 520);
    document.documentElement.style.setProperty('--s', (w / 1080).toFixed(4));
  }
  scale(); window.addEventListener('resize', scale);
})();
</script>
</body>
</html>
