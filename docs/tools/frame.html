<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .stage { box-sizing: border-box; border-radius: 28px; padding: 44px 48px 52px;
    background: radial-gradient(1200px 500px at 15% 0%, #c7d2fe 0%, transparent 60%),
                radial-gradient(900px 500px at 100% 100%, #bae6fd 0%, transparent 55%),
                linear-gradient(135deg, #eef2ff 0%, #e0f2fe 100%); }
  .stage.dark { background: radial-gradient(1200px 500px at 15% 0%, #312e81 0%, transparent 60%),
                radial-gradient(900px 500px at 100% 100%, #0c4a6e 0%, transparent 55%),
                linear-gradient(135deg, #0b1020 0%, #0f172a 100%); }
  .win { border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 30px 60px -12px rgba(15,23,42,.35), 0 0 0 1px rgba(15,23,42,.08); }
  .bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #f1f3f5; border-bottom: 1px solid #e2e5e9; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .url { margin-left: 18px; flex: 1; max-width: 560px; height: 24px; border-radius: 8px; background: #fff; border: 1px solid #e2e5e9;
    font: 12.5px -apple-system, "Segoe UI", Roboto, sans-serif; color: #5f6b7a; display: flex; align-items: center; padding: 0 12px; }
  iframe { display: block; border: 0; background: #fff; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="win">
    <div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="url" id="url"></span></div>
    <iframe id="f"></iframe>
  </div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  f.width = q.get('w') || 1200; f.height = q.get('h') || 740;
  document.getElementById('url').textContent = q.get('title') || '';
  if (q.get('dark')) document.getElementById('stage').classList.add('dark');
  f.onload = function () { var y = +(q.get('scroll') || 0); if (y) f.contentWindow.scrollTo(0, y); };
  f.src = q.get('src');
</script>
</body>
</html>
